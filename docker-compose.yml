name: gestion-rutina

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-rutina-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_rutina}
      POSTGRES_USER: ${POSTGRES_USER:-gestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion} -d ${POSTGRES_DB:-gestion_rutina}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gestion-rutina-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestion_rutina}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gestion}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gestion}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-jwt-secret-cambiar-antes-de-desplegar}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gestion-rutina-web
    environment:
      VITE_API_PROXY: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
