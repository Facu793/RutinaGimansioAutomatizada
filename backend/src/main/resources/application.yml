spring:
  application:
    name: gestion-rutina
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestion_rutina}
    username: ${SPRING_DATASOURCE_USERNAME:gestion}
    password: ${SPRING_DATASOURCE_PASSWORD:gestion}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Argentina/Buenos_Aires

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-jwt-secret-cambiar-antes-de-desplegar}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:12}
